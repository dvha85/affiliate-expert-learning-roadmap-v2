name: Mission Agent Path CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: mission-agent-path-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mission-semantics-and-blueprints:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Validate mission-specific semantic plug-ins
        run: |
          python scripts/validate_agent_semantics.py
          python scripts/validate_semantic_contracts.py
          python scripts/validate_m11.py

  mission-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: lab/mission-runtime/go.mod
          cache-dependency-path: |
            lab/mission-runtime/go.sum
            core/go.sum
      - name: Shared M03 core tests and vet without workspace
        working-directory: core
        env:
          GOWORK: "off"
        run: go test ./... && go vet ./...
      - name: M03-M11 independent harness eval packs
        working-directory: lab/mission-runtime
        run: go test ./...
      - name: Vet mission runtime
        working-directory: lab/mission-runtime
        run: go vet ./...
      - name: Smoke all mission demos
        working-directory: lab/mission-runtime
        run: |
          go run ./cmd/demo O00 | grep -q 'DRY_RUN_ONLY'
          go run ./cmd/demo M03 | grep -q 'VALID'
          go run ./cmd/demo m03-check testdata/m03-action.json testdata/m03-outcome.json | grep -q '"result":"VALID"'
          go run ./cmd/demo M04 | grep -q 'SUPPORTED'
          go run ./cmd/demo advisor-check testdata/m04-advisor-output.json testdata/m04-evidence.json 2026-09-03T01:00:00Z 24 | grep -q 'SUPPORTED'
          go run ./cmd/demo M05 | grep -q 'REVIEW_REQUIRED'
          go run ./cmd/demo m05-check testdata/m03-action.json testdata/m05-outcomes.json testdata/m05-evaluations.json testdata/m05-proposal.json testdata/m05-review.json | grep -q '"execution_authorized":false'
          go run ./cmd/demo M06 | grep -q 'NEW'
          go run ./cmd/demo m06-check testdata/m06-response.json | grep -q '"evidence_kind":"synthetic"'
          go run ./cmd/demo M07 | grep -q 'SUPPORTED'
          go run ./cmd/demo m07-check testdata/m07-proposal.json testdata/m07-registry.json testdata/m07-evidence-ids.json | grep -q '"execution_authorized":false'
          go run ./cmd/demo M08 | grep -q 'SHADOW_POLICY_ALLOW'
          go run ./cmd/demo m08-check testdata/m08-intent.json testdata/m08-context.json | grep -q '"reason":"SHADOW_POLICY_ALLOW"'
          go run ./cmd/demo M08 | grep -q '"policy_mode": "NON_AUTHORIZING"'
          go run ./cmd/demo M08 | grep -q '"execution_authorized": false'
          go run ./cmd/demo M09 | grep -q 'HUMAN_APPROVAL_REQUIRED'
          go run ./cmd/demo m09-check testdata/m08-intent.json testdata/m09-policy.json testdata/m09-approval.json testdata/m09-authorization.json testdata/m09-execution.json | grep -q '"result":"CONSISTENT_UNVERIFIED"'
          go run ./cmd/demo M09 | grep -q '"execution_mode": "APPROVED_LIVE"'
          go run ./cmd/demo M10 | grep -q '"execution_mode": "GOVERNED_CANARY"'
          go run ./cmd/demo m10-check approval testdata/m10-approval.json | grep -q '"result":"ARTIFACT_VALID_UNVERIFIED"'
          go run ./cmd/demo M10 | grep -q '"side_effect_state": "PERFORMED"'
          go run ./cmd/demo M11 | grep -q 'GOVERNED_PRODUCTION'
          go run ./cmd/demo m11-check activation testdata/m11-activation.json | grep -q '"result":"ARTIFACT_VALID_UNVERIFIED"'
          go run ./cmd/demo M11 | grep -q '"decision": "ALLOW_PRODUCTION"'
          go run ./cmd/demo M11 | grep -q '"execution_authorized": false'
          go run ./cmd/demo M11 | grep -q '"execution_mode": "GOVERNED_PRODUCTION"'
          go run ./cmd/demo M11 | grep -q '"production_lease_hash": "sha256:'
          go run ./cmd/demo M11 | grep -q '"production_health_snapshot_hash": "sha256:'
          go run ./cmd/demo M11 | grep -q '"side_effect_state": "PERFORMED"'

  n8n-engine-regression:
    name: n8n-engine-regression
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      N8N_VERSION: "2.38.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The PR path gate diffs against the base commit. Keep both parents
          # of GitHub's synthetic merge commit available without a full clone.
          fetch-depth: 2
      - name: Select n8n engine coverage
        id: n8n-inputs
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "reason=main_push" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA")"
          scope_status=0
          scope="$(printf '%s\n' "$changed" | python scripts/n8n_change_scope.py)" || scope_status=$?
          case "$scope_status:$scope" in
            0:run)
              echo "run=true" >> "$GITHUB_OUTPUT"
              echo "reason=n8n_related_change" >> "$GITHUB_OUTPUT"
              ;;
            1:skip)
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "reason=no_n8n_related_change" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "n8n scope helper failed (exit $scope_status); refusing to skip coverage" >&2
              exit 1
              ;;
          esac
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        if: steps.n8n-inputs.outputs.run == 'true'
        with:
          go-version-file: lab/affiliate-bot/go.mod
          cache-dependency-path: |
            lab/affiliate-bot/go.sum
            contracts/go.sum
            core/go.sum
            lab/mission-runtime/go.sum
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        if: steps.n8n-inputs.outputs.run == 'true'
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.n8n-inputs.outputs.run == 'true'
        with:
          node-version: "24"
      - name: Restore pinned n8n runtime
        id: n8n-cache
        if: steps.n8n-inputs.outputs.run == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/n8n-rp08/node_modules
          key: n8n-engine-${{ runner.os }}-node24-v${{ env.N8N_VERSION }}
      - name: Install pinned n8n engine for disposable offline runtime
        if: steps.n8n-inputs.outputs.run == 'true' && steps.n8n-cache.outputs.cache-hit != 'true'
        run: npm install --prefix "$RUNNER_TEMP/n8n-rp08" --no-audit --no-fund "n8n@$N8N_VERSION"
      - name: Run M06/M07 engine paths and real M06 Schedule Trigger admission
        if: steps.n8n-inputs.outputs.run == 'true'
        run: |
          python scripts/check_n8n_flatted_parity.py --node-modules "$RUNNER_TEMP/n8n-rp08/node_modules"
          python scripts/run_n8n_engine_regression.py \
            --n8n-cli "$RUNNER_TEMP/n8n-rp08/node_modules/.bin/n8n"
          python scripts/run_n8n_m06_schedule_regression.py \
            --n8n-cli "$RUNNER_TEMP/n8n-rp08/node_modules/.bin/n8n"
      - name: Report scoped engine skip
        if: steps.n8n-inputs.outputs.run != 'true'
        run: >-
          echo "n8n engine regression skipped: ${{ steps.n8n-inputs.outputs.reason }}; full coverage still runs on main pushes."

  mission-gate:
    name: mission-gate
    if: ${{ always() }}
    needs:
      - mission-semantics-and-blueprints
      - mission-runtime
      - n8n-engine-regression
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every mission job to pass
        run: |
          test "${{ needs.mission-semantics-and-blueprints.result }}" = success
          test "${{ needs.mission-runtime.result }}" = success
          test "${{ needs.n8n-engine-regression.result }}" = success
