name: Mission Agent Path CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  mission-semantics-and-blueprints:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate mission-specific semantic plug-ins
        run: |
          python scripts/validate_agent_semantics.py
          python scripts/validate_semantic_contracts.py
          python scripts/validate_m11.py

  mission-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: lab/mission-runtime/go.mod
      - name: O00 and M03-M11 executable eval packs
        working-directory: lab/mission-runtime
        run: go test ./...
      - name: Vet mission runtime
        working-directory: lab/mission-runtime
        run: go vet ./...
      - name: Smoke all mission demos
        working-directory: lab/mission-runtime
        run: |
          go run ./cmd/demo O00 | grep -q 'DRY_RUN_ONLY'
          go run ./cmd/demo M03 | grep -q 'VALID'
          go run ./cmd/demo m03-check testdata/m03-action.json testdata/m03-outcome.json | grep -q '"result":"VALID"'
          go run ./cmd/demo M04 | grep -q 'SUPPORTED'
          go run ./cmd/demo advisor-check testdata/m04-advisor-output.json testdata/m04-evidence.json 2026-09-03T01:00:00Z 24 | grep -q 'SUPPORTED'
          go run ./cmd/demo M05 | grep -q 'REVIEW_REQUIRED'
          go run ./cmd/demo m05-check testdata/m03-action.json testdata/m05-outcomes.json testdata/m05-evaluations.json testdata/m05-proposal.json testdata/m05-review.json | grep -q '"execution_authorized":false'
          go run ./cmd/demo M06 | grep -q 'NEW'
          go run ./cmd/demo m06-check testdata/m06-response.json | grep -q '"evidence_kind":"synthetic"'
          go run ./cmd/demo M07 | grep -q 'SUPPORTED'
          go run ./cmd/demo m07-check testdata/m07-proposal.json testdata/m07-registry.json testdata/m07-evidence-ids.json | grep -q '"execution_authorized":false'
          go run ./cmd/demo M08 | grep -q 'SHADOW_POLICY_ALLOW'
          go run ./cmd/demo m08-check testdata/m08-intent.json testdata/m08-context.json | grep -q '"reason":"SHADOW_POLICY_ALLOW"'
          go run ./cmd/demo M08 | grep -q '"policy_mode": "NON_AUTHORIZING"'
          go run ./cmd/demo M08 | grep -q '"execution_authorized": false'
          go run ./cmd/demo M09 | grep -q 'HUMAN_APPROVAL_REQUIRED'
          go run ./cmd/demo m09-check testdata/m08-intent.json testdata/m09-policy.json testdata/m09-approval.json testdata/m09-authorization.json testdata/m09-execution.json | grep -q '"result":"CONSISTENT_UNVERIFIED"'
          go run ./cmd/demo M09 | grep -q '"execution_mode": "APPROVED_LIVE"'
          go run ./cmd/demo M10 | grep -q '"execution_mode": "GOVERNED_CANARY"'
          go run ./cmd/demo m10-check approval testdata/m10-approval.json | grep -q '"result":"ARTIFACT_VALID_UNVERIFIED"'
          go run ./cmd/demo M10 | grep -q '"side_effect_state": "PERFORMED"'
          go run ./cmd/demo M11 | grep -q 'GOVERNED_PRODUCTION'
          go run ./cmd/demo m11-check activation testdata/m11-activation.json | grep -q '"result":"ARTIFACT_VALID_UNVERIFIED"'
          go run ./cmd/demo M11 | grep -q '"decision": "ALLOW_PRODUCTION"'
          go run ./cmd/demo M11 | grep -q '"execution_authorized": false'
          go run ./cmd/demo M11 | grep -q '"execution_mode": "GOVERNED_PRODUCTION"'
          go run ./cmd/demo M11 | grep -q '"production_lease_hash": "sha256:'
          go run ./cmd/demo M11 | grep -q '"production_health_snapshot_hash": "sha256:'
          go run ./cmd/demo M11 | grep -q '"side_effect_state": "PERFORMED"'
