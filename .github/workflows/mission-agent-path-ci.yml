name: Mission Agent Path CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  structure-language-and-blueprints:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate learner-operable mission path
        run: python scripts/validate_agent_path.py
      - name: Validate Vietnamese-first learner language
        run: python scripts/validate_language_policy.py

  mission-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: lab/mission-runtime/go.mod
      - name: O00 and M03-M10 executable eval packs
        working-directory: lab/mission-runtime
        run: go test ./...
      - name: Vet mission runtime
        working-directory: lab/mission-runtime
        run: go vet ./...
      - name: Smoke all mission demos
        working-directory: lab/mission-runtime
        run: |
          go run ./cmd/demo O00 | grep -q 'DRY_RUN_ONLY'
          go run ./cmd/demo M03 | grep -q 'VALID'
          go run ./cmd/demo M04 | grep -q 'SUPPORTED'
          go run ./cmd/demo M05 | grep -q 'REVIEW_REQUIRED'
          go run ./cmd/demo M06 | grep -q 'NEW'
          go run ./cmd/demo M07 | grep -q 'SUPPORTED'
          go run ./cmd/demo M08 | grep -q 'SHADOW_POLICY_ALLOW'
          go run ./cmd/demo M08 | grep -q '"execution_authorized": false'
          go run ./cmd/demo M09 | grep -q 'HUMAN_APPROVAL_REQUIRED'
          go run ./cmd/demo M09 | grep -q '"execution_mode": "APPROVED_LIVE"'
          go run ./cmd/demo M09 | grep -q '"execution_authorized": true'
          go run ./cmd/demo M09 | grep -q '"side_effect_state": "PERFORMED"'
          go run ./cmd/demo M10 | grep -q 'GOVERNED_CANARY'
          go run ./cmd/demo M10 | grep -q '"decision": "ALLOW_CANARY"'
          go run ./cmd/demo M10 | grep -q '"execution_authorized": false'
          go run ./cmd/demo M10 | grep -q '"execution_mode": "GOVERNED_CANARY"'
          go run ./cmd/demo M10 | grep -q '"side_effect_state": "PERFORMED"'

  safety-and-linkage-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Guard M03-M10 authority ceilings and linkage
        run: |
          grep -q '"performed_by".*"const":"human"' contracts/action-record.schema.json
          grep -q '"write_tool_requested"' contracts/advisor-output.schema.json
          grep -q '"auto_apply".*"const":false' contracts/improvement-proposal.schema.json
          grep -q '"reviewed_by".*"const":"human"' contracts/review-record.schema.json
          grep -q '"read_only".*"const":true' contracts/tool-registry.schema.json
          grep -q 'BROKEN_LINK' lab/mission-runtime/cmd/demo/m03_m05.go
          grep -q 'ABSTAIN_FUTURE' lab/mission-runtime/cmd/demo/m03_m05.go
          grep -q 'REJECT_WRITE_METHOD' lab/mission-runtime/cmd/demo/m06_m07.go
          grep -q 'REJECT_TOOL' lab/mission-runtime/cmd/demo/m06_m07.go
          grep -q 'tool_result_text' evals/M07-readonly-evidence-agent/cases.json
          grep -q '"shadow_only".*"const": true' contracts/action-intent.schema.json
          grep -q '"dry_run".*"const": true' contracts/action-intent.schema.json
          grep -q '"execution_authorized".*"const": false' contracts/policy-decision.schema.json
          grep -q 'TAMPERED_INTENT' lab/mission-runtime/cmd/demo/m08.go
          grep -q 'IDEMPOTENCY_COLLISION' lab/mission-runtime/cmd/demo/m08.go
          grep -q 'POLICY_UNAVAILABLE' lab/mission-runtime/cmd/demo/m08.go
          grep -q '"approved_by".*"const":"human"' contracts/approval-record.schema.json
          grep -q '"one_time".*"const":true' contracts/approval-record.schema.json
          grep -q 'APPROVED_LIVE' contracts/execution-authorization.schema.json
          grep -q 'GOVERNED_CANARY' contracts/execution-authorization.schema.json
          grep -q '"execution_authorized".*"const":true' contracts/execution-authorization.schema.json
          grep -q 'RECONCILIATION_REQUIRED' contracts/execution-record.schema.json
          grep -q 'DENY_POLICY_REVALIDATION' lab/mission-runtime/cmd/demo/m09.go
          grep -q 'DENY_KILL_SWITCH' lab/mission-runtime/cmd/demo/m09.go
          grep -q 'WAIT_APPROVAL_CONSUMED' lab/mission-runtime/cmd/demo/m09.go
          grep -q 'WAIT_RECONCILIATION' lab/mission-runtime/cmd/demo/m09.go
          grep -q 'PersistM09State' lab/mission-runtime/cmd/demo/m09.go
          grep -q '"approved_by".*"const":"human"' contracts/canary-grant.schema.json
          grep -q '"allowed_risk_classes"' contracts/canary-grant.schema.json
          grep -q '"execution_authorized".*"const":false' contracts/canary-gate-decision.schema.json
          grep -q 'RISK2_PER_ACTION_APPROVAL_REQUIRED' lab/mission-runtime/cmd/demo/m10.go
          grep -q 'OUTCOME_BACKPRESSURE' lab/mission-runtime/cmd/demo/m10.go
          grep -q 'RECONCILIATION_REQUIRED' lab/mission-runtime/cmd/demo/m10.go
          grep -q 'GRANT_REVOKED' lab/mission-runtime/cmd/demo/m10.go
