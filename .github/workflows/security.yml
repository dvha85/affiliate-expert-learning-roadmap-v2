name: Security Scans

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: codeql-go
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: lab/affiliate-bot/go.mod
          cache-dependency-path: |
            contracts/go.sum
            core/go.sum
            lab/affiliate-bot/go.sum
            lab/mission-runtime/go.sum
      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          languages: go
          build-mode: autobuild
      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          category: /language:go

  govulncheck:
    name: govulncheck-go-modules
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: lab/affiliate-bot/go.mod
          cache-dependency-path: |
            contracts/go.sum
            core/go.sum
            lab/affiliate-bot/go.sum
            lab/mission-runtime/go.sum
      - name: Install pinned govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - name: Scan every Go module
        shell: bash
        run: |
          set -euo pipefail
          for module in contracts core lab/affiliate-bot lab/mission-runtime; do
            echo "Scanning $module"
            (cd "$module" && "$(go env GOPATH)/bin/govulncheck" ./...)
          done
