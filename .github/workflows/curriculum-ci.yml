name: Curriculum CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  curriculum:
    name: curriculum
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python scripts/validate_repo.py

  evidence-and-safety:
    name: evidence-and-safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python scripts/validate_repo.py
      - name: Guard consequential boundaries
        run: |
          grep -q "Decision != Approval != Execution" CURRICULUM.md
          grep -q "Tool result != trusted evidence" CURRICULUM.md
          grep -q "real evidence != automatic recommendation" CURRICULUM.md
          grep -q "real evidence != RECOMMEND" lab/affiliate-bot/README.md
          grep -q '"M01-E07-conflict-dominates-missing"' evals/M01-deterministic-bot/cases.json
          grep -q '"M02-E06-unknown-formula"' evals/M02-history-replay/cases.json
          grep -q "replay MATCH != RECOMMEND" lab/affiliate-bot/README.md

  python-regression:
    name: python-regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m compileall -q scripts
      - run: python scripts/validate_repo.py

  deterministic-runtime:
    name: deterministic-runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: lab/affiliate-bot/go.mod
      - name: Go test including M01 and M02 eval packs
        working-directory: lab/affiliate-bot
        run: go test ./...
      - name: Go vet
        working-directory: lab/affiliate-bot
        run: go vet ./...
      - name: Run M01 deterministic baseline
        working-directory: lab/affiliate-bot
        run: go run ./cmd/bot
      - name: M02 capture restart query replay smoke test
        working-directory: lab/affiliate-bot
        run: |
          rm -f /tmp/m02-history.jsonl
          go run ./cmd/bot history capture /tmp/m02-history.jsonl data/sample-observations.json ci-demo 2026-09-01T10:00:00Z 2026-09-03T10:00:00Z
          go run ./cmd/bot history list /tmp/m02-history.jsonl | grep -q "ci-demo"
          go run ./cmd/bot history replay /tmp/m02-history.jsonl | grep -q "replay=MATCH"
