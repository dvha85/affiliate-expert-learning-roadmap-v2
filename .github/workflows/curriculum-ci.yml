name: Curriculum CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  structure-language-and-foundations:
    name: structure-language-and-foundations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Artifact spine regression tests
        run: python -m unittest discover -s scripts/tests -v
      - run: python scripts/validate_missions.py
      - run: python scripts/validate_repo.py
      - run: python scripts/validate_artifact_spine.py
      - run: python scripts/validate_continuity.py
      - run: python scripts/validate_language_policy.py

      - name: Guard consequential boundaries
        run: |
          grep -q "Decision (quyết định) != Approval (phê duyệt) != Execution (thực thi)" CURRICULUM.md
          grep -q "Tool result (kết quả tool) != trusted evidence (bằng chứng đáng tin)" CURRICULUM.md
          grep -q "real evidence (bằng chứng thật) != automatic recommendation (khuyến nghị tự động)" CURRICULUM.md
          grep -q "real evidence != RECOMMEND" lab/affiliate-bot/README.md
          grep -q '"M01-E07-conflict-dominates-missing"' evals/M01-deterministic-bot/cases.json
          grep -q '"M02-E07-input-hash-tamper"' evals/M02-history-replay/cases.json
          grep -q '"M02-E12-observation-id-reuse-conflict"' evals/M02-history-replay/cases.json
          grep -q "replay MATCH != business truth" lab/affiliate-bot/README.md

      - run: python -m compileall -q scripts

  deterministic-runtime:
    name: deterministic-runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: lab/affiliate-bot/go.mod
      - name: Go test including executable M01 and M02 eval packs
        working-directory: lab/affiliate-bot
        run: go test ./...
      - name: Learner Bot race regression
        working-directory: lab/affiliate-bot
        run: go test -race ./...
      - name: Embedded canonical schema tests
        working-directory: contracts
        run: |
          go test ./...
          go vet ./...
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Beginner quickstart isolated-clone smoke
        run: python scripts/smoke_quickstart.py
      - name: BR-08 learner and harness integration smoke
        run: python scripts/smoke_br08.py
      - name: BR-09 evidence import continuity smoke
        run: python scripts/smoke_br09.py
      - name: BR-10a action record continuity smoke
        run: python scripts/smoke_br10a.py
      - name: BR-10b outcome continuity smoke
        run: python scripts/smoke_br10b.py
      - name: BR-10d ACCESSTRADE sanitized CSV adapter
        run: python scripts/smoke_br10d_accesstrade.py
      - name: BR-10c full learner chain audit
        run: python scripts/smoke_br10c.py
      - name: BR-11a mock advisor smoke
        run: python scripts/smoke_br11a.py
      - name: BR-12d M00-M05 and isolated regression rollback
        run: python scripts/smoke_br12d.py
      - name: BR-13b fixture watcher history handoff
        run: python scripts/smoke_br13b.py
      - name: BR-13c pinned HTTPS fixture fetch
        run: python scripts/smoke_br13c.py
      - name: BR-14a n8n M06 static contract
        run: python scripts/validate_n8n_m06.py
      - name: BR-14b n8n M06 case contract
        run: python scripts/validate_n8n_m06_cases.py
      - name: BR-15a M07 static contract
        run: python scripts/validate_n8n_m07.py
      - name: BR-15b M07 adversarial contract
        run: python scripts/validate_n8n_m07_adversarial.py
      - name: BR-15c M07 output contract
        run: python scripts/validate_n8n_m07_output_cases.py
      - name: BR-16a shared M00-M11 learner chain
        run: |
          walkthrough_workspace="$(mktemp -d)"
          python scripts/smoke_br16a_offline.py --workspace "$walkthrough_workspace"
          test -f "$walkthrough_workspace/walkthrough-result.json"
          test -f "$walkthrough_workspace/restored/history.jsonl"
          if python scripts/smoke_br16a_offline.py --workspace "$walkthrough_workspace"; then
            echo "expected a retained non-empty walkthrough workspace to be rejected" >&2
            exit 1
          fi
      - name: BR-18b M11 backup, reconciliation and restore
        run: python scripts/smoke_br18b_backup_restore.py
      - name: RP-08 M11 canonical identity mutation proof
        run: python scripts/mutate_m11_identity_guard.py
      - name: RP-08 M10 canonical identity mutation proof
        run: python scripts/mutate_m10_identity_guard.py
      - name: RP-08 backup source identity mutation proof
        run: python scripts/mutate_backup_source_guard.py
      - name: RP-08 canonical runtime-store path mutation proof
        run: python scripts/mutate_runtime_store_path_guard.py
      - name: RP-08 recovery-journal path mutation proof
        run: python scripts/mutate_recovery_journal_path_guard.py
      - name: RP-08 M07 tool-result path mutation proof
        run: python scripts/mutate_m07_tool_artifact_path_guard.py
      - name: RP-08 M07 backup sidecar path mutation proof
        run: python scripts/mutate_m07_backup_sidecar_path_guard.py
      - name: RP-08 M08 M07-proposal path mutation proof
        run: python scripts/mutate_m08_m07_proposal_path_guard.py
      - name: RP-08 M07 strict output decoder mutation proof
        run: python scripts/mutate_m07_strict_output_decoder.py
      - name: BR-19a readiness audit
        run: python scripts/audit_readiness.py
      - name: Go vet
        working-directory: lab/affiliate-bot
        run: go vet ./...
      - name: Run M01 deterministic baseline
        working-directory: lab/affiliate-bot
        run: go run ./cmd/bot
      - name: M02 capture restart query replay smoke test
        working-directory: lab/affiliate-bot
        run: |
          rm -f /tmp/m02-history.jsonl
          go run ./cmd/bot history capture /tmp/m02-history.jsonl data/m02-sample-observations.json ci-demo 2026-09-01T01:00:00Z 2026-09-03T10:00:00Z
          go run ./cmd/bot history list /tmp/m02-history.jsonl | grep -q "ci-demo"
          go run ./cmd/bot history replay /tmp/m02-history.jsonl | grep -q "replay=MATCH"
          go run ./cmd/bot history decision /tmp/m02-history.jsonl ci-demo data/m02-decision-context.json | grep -q '"action": null'
