name: Curriculum CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  structure-language-and-foundations:
    name: structure-language-and-foundations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Artifact spine regression tests
        run: python -m unittest discover -s scripts/tests -v
      - run: python scripts/validate_missions.py
      - run: python scripts/validate_repo.py
      - run: python scripts/validate_artifact_spine.py
      - run: python scripts/validate_continuity.py
      - run: python scripts/validate_language_policy.py

      - name: Guard consequential boundaries
        run: |
          grep -q "Decision (quyết định) != Approval (phê duyệt) != Execution (thực thi)" CURRICULUM.md
          grep -q "Tool result (kết quả tool) != trusted evidence (bằng chứng đáng tin)" CURRICULUM.md
          grep -q "real evidence (bằng chứng thật) != automatic recommendation (khuyến nghị tự động)" CURRICULUM.md
          grep -q "real evidence != RECOMMEND" lab/affiliate-bot/README.md
          grep -q '"M01-E07-conflict-dominates-missing"' evals/M01-deterministic-bot/cases.json
          grep -q '"M02-E07-input-hash-tamper"' evals/M02-history-replay/cases.json
          grep -q '"M02-E12-observation-id-reuse-conflict"' evals/M02-history-replay/cases.json
          grep -q "replay MATCH != business truth" lab/affiliate-bot/README.md

      - run: python -m compileall -q scripts

  deterministic-runtime:
    name: deterministic-runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: lab/affiliate-bot/go.mod
          # The repository has multiple Go modules. Declare every checksum so
          # setup-go can safely cache both the module and build caches.
          cache-dependency-path: |
            lab/affiliate-bot/go.sum
            contracts/go.sum
            core/go.sum
            lab/mission-runtime/go.sum
      - name: Learner Bot internal packages
        working-directory: lab/affiliate-bot
        run: go test ./internal/...
      - name: Embedded canonical schema tests
        working-directory: contracts
        run: |
          go test ./...
          go vet ./...
      - name: Go vet
        working-directory: lab/affiliate-bot
        run: go vet ./...
      - name: Build learner Bot once for CLI smoke commands
        working-directory: lab/affiliate-bot
        run: go build -o "$RUNNER_TEMP/learner-bot" ./cmd/bot
      - name: Run M01 deterministic baseline
        working-directory: lab/affiliate-bot
        run: "$RUNNER_TEMP/learner-bot"
      - name: M02 capture restart query replay smoke test
        working-directory: lab/affiliate-bot
        run: |
          rm -f /tmp/m02-history.jsonl
          "$RUNNER_TEMP/learner-bot" history capture /tmp/m02-history.jsonl data/m02-sample-observations.json ci-demo 2026-09-01T01:00:00Z 2026-09-03T10:00:00Z
          "$RUNNER_TEMP/learner-bot" history list /tmp/m02-history.jsonl | grep -q "ci-demo"
          "$RUNNER_TEMP/learner-bot" history replay /tmp/m02-history.jsonl | grep -q "replay=MATCH"
          "$RUNNER_TEMP/learner-bot" history decision /tmp/m02-history.jsonl ci-demo data/m02-decision-context.json | grep -q '"action": null'

  windows-runtime:
    name: windows-runtime
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: lab/affiliate-bot/go.mod
          cache-dependency-path: |
            lab/affiliate-bot/go.sum
            contracts/go.sum
            core/go.sum
            lab/mission-runtime/go.sum
      - name: Learner Bot full Windows tests
        working-directory: lab/affiliate-bot
        run: go test ./...
      - name: Learner Bot Windows vet
        working-directory: lab/affiliate-bot
        run: go vet ./...
      - name: Windows managed-lock and backup/restore regressions
        working-directory: lab/affiliate-bot
        run: go test -count=1 ./cmd/bot -run "Test(ManagedPathLock|RuntimeGate|Backup|Restore)"

  learner-bot-tests-shard-0:
    name: learner-bot-tests-shard-0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: lab/affiliate-bot/go.mod
          cache-dependency-path: |
            lab/affiliate-bot/go.sum
            contracts/go.sum
            core/go.sum
            lab/mission-runtime/go.sum
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify deterministic learner Bot shard helper
        run: python -m unittest scripts.tests.test_run_learner_bot_test_shard -v
      - name: Learner Bot top-level tests, deterministic shard 0
        run: python scripts/run_learner_bot_test_shard.py --shard-index 0 --shard-count 2

  learner-bot-tests-shard-1:
    name: learner-bot-tests-shard-1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: lab/affiliate-bot/go.mod
          cache-dependency-path: |
            lab/affiliate-bot/go.sum
            contracts/go.sum
            core/go.sum
            lab/mission-runtime/go.sum
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify deterministic learner Bot shard helper
        run: python -m unittest scripts.tests.test_run_learner_bot_test_shard -v
      - name: Learner Bot top-level tests, deterministic shard 1
        run: python scripts/run_learner_bot_test_shard.py --shard-index 1 --shard-count 2

  learner-bot-race:
    name: learner-bot-race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: lab/affiliate-bot/go.mod
          # The race build has a separate build-cache key. Keep every module
          # checksum here too, so cache restoration remains safe when shared
          # contracts/core dependencies change.
          cache-dependency-path: |
            lab/affiliate-bot/go.sum
            contracts/go.sum
            core/go.sum
            lab/mission-runtime/go.sum
      - name: Learner Bot race regression
        working-directory: lab/affiliate-bot
        run: go test -race ./...

  deterministic-quickstart:
    name: deterministic-quickstart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: lab/affiliate-bot/go.mod
          cache-dependency-path: |
            lab/affiliate-bot/go.sum
            contracts/go.sum
            core/go.sum
            lab/mission-runtime/go.sum
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Beginner quickstart isolated-clone smoke
        run: python scripts/smoke_quickstart.py

  deterministic-smokes-foundations:
    name: deterministic-smokes-foundations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: lab/affiliate-bot/go.mod
          cache-dependency-path: |
            lab/affiliate-bot/go.sum
            contracts/go.sum
            core/go.sum
            lab/mission-runtime/go.sum
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: BR-08 learner and harness integration smoke
        run: python scripts/smoke_br08.py
      - name: BR-09 evidence import continuity smoke
        run: python scripts/smoke_br09.py
      - name: BR-10a action record continuity smoke
        run: python scripts/smoke_br10a.py
      - name: BR-10b outcome continuity smoke
        run: python scripts/smoke_br10b.py
      - name: BR-10d ACCESSTRADE sanitized CSV adapter
        run: python scripts/smoke_br10d_accesstrade.py
      - name: BR-10c full learner chain audit
        run: python scripts/smoke_br10c.py
      - name: BR-11a mock advisor smoke
        run: python scripts/smoke_br11a.py
      - name: BR-12d M00-M05 and isolated regression rollback
        run: python scripts/smoke_br12d.py

  deterministic-smokes-m06-m07:
    name: deterministic-smokes-m06-m07
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: lab/affiliate-bot/go.mod
          cache-dependency-path: |
            lab/affiliate-bot/go.sum
            contracts/go.sum
            core/go.sum
            lab/mission-runtime/go.sum
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: BR-13b fixture watcher history handoff
        run: python scripts/smoke_br13b.py
      - name: BR-13c pinned HTTPS fixture fetch
        run: python scripts/smoke_br13c.py
      - name: BR-14a n8n M06 static contract
        run: python scripts/validate_n8n_m06.py
      - name: BR-14 selected-source M06 static contract
        run: python scripts/validate_n8n_m06_selected_source.py
      - name: BR-14b n8n M06 case contract
        run: python scripts/validate_n8n_m06_cases.py
      - name: BR-15a M07 static contract
        run: python scripts/validate_n8n_m07.py
      - name: BR-15b M07 adversarial contract
        run: python scripts/validate_n8n_m07_adversarial.py
      - name: BR-15c M07 output contract
        run: python scripts/validate_n8n_m07_output_cases.py
      - name: BR-16a shared M00-M11 learner chain
        run: |
          walkthrough_workspace="$(mktemp -d)"
          python scripts/smoke_br16a_offline.py --workspace "$walkthrough_workspace"
          test -f "$walkthrough_workspace/walkthrough-result.json"
          test -f "$walkthrough_workspace/restored/history.jsonl"
          if python scripts/smoke_br16a_offline.py --workspace "$walkthrough_workspace"; then
            echo "expected a retained non-empty walkthrough workspace to be rejected" >&2
            exit 1
          fi

  deterministic-smokes-backup-mutations:
    name: deterministic-smokes-backup-mutations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: lab/affiliate-bot/go.mod
          cache-dependency-path: |
            lab/affiliate-bot/go.sum
            contracts/go.sum
            core/go.sum
            lab/mission-runtime/go.sum
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: BR-18b M11 backup, reconciliation and restore
        run: python scripts/smoke_br18b_backup_restore.py
      - name: RP-08 M11 evaluation-to-closed-cycle mutation proof
        run: python scripts/mutate_backup_m11_terminal_chain.py
      - name: RP-08 M11 ledger-outcome reverse mutation proof
        run: python scripts/mutate_backup_m11_ledger_outcome_reverse_guard.py
      - name: RP-08 M11 failed-execution outcome mutation proof
        run: python scripts/mutate_backup_m11_failed_outcome.py
      - name: RP-08 M11 reservation lineage mutation proof
        run: python scripts/mutate_m11_reservation_lineage.py
      - name: RP-08 M11 gate budget snapshot mutation proof
        run: python scripts/mutate_m11_gate_budget_snapshot.py
      - name: RP-08 M11 gate health policy mutation proof
        run: python scripts/mutate_m11_health_policy.py
      - name: RP-08 M11 exact lease-expiry mutation proof
        run: python scripts/mutate_m11_expiry_authority.py
      - name: RP-08 M11 ledger activation mutation proof
        run: python scripts/mutate_m11_ledger_activation.py
      - name: RP-08 M11 canonical identity mutation proof
        run: python scripts/mutate_m11_identity_guard.py
      - name: RP-08 M11 authorization gate lineage mutation proof
        run: python scripts/mutate_m11_authorization_lineage.py
      - name: RP-08 M11 reverse-ledger graph mutation proof
        run: python scripts/mutate_m11_reverse_ledger_graph.py
      - name: RP-08 M11 outcome-link graph mutation proof
        run: python scripts/mutate_m11_outcome_link_graph.py
      - name: RP-08 M10 canonical identity mutation proof
        run: python scripts/mutate_m10_identity_guard.py
      - name: RP-08 M10/M11 registry graph envelope mutation proof
        run: python scripts/mutate_registry_graph_envelope_integrity.py
      - name: RP-08 backup source identity mutation proof
        run: python scripts/mutate_backup_source_guard.py
      - name: RP-08 canonical runtime-store path mutation proof
        run: python scripts/mutate_runtime_store_path_guard.py
      - name: RP-08 recovery-journal path mutation proof
        run: python scripts/mutate_recovery_journal_path_guard.py
      - name: RP-08 M07 tool-result path mutation proof
        run: python scripts/mutate_m07_tool_artifact_path_guard.py
      - name: RP-08 M07 portable-input path mutation proof
        run: python scripts/mutate_m07_portable_input_guard.py
      - name: RP-08 general CLI portable-input path mutation proof
        run: python scripts/mutate_general_portable_input_guard.py
      - name: RP-08 internal portable-input path mutation proof
        run: python scripts/mutate_internal_portable_input_guard.py
      - name: RP-08 M07 backup sidecar path mutation proof
        run: python scripts/mutate_m07_backup_sidecar_path_guard.py
      - name: RP-08 M08 M07-proposal path mutation proof
        run: python scripts/mutate_m08_m07_proposal_path_guard.py
      - name: RP-08 M08-M11 portable-input path mutation proof
        run: python scripts/mutate_mission_portable_input_guard.py
      - name: RP-08 durable STOP immutability mutation proof
        run: python scripts/mutate_mission_stop_immutability_guard.py
      - name: RP-08 M07 strict output decoder mutation proof
        run: python scripts/mutate_m07_strict_output_decoder.py
      - name: RP-08 M07 strict registry decoder mutation proof
        run: python scripts/mutate_m07_registry_strict_decoder.py
      - name: BR-19a readiness audit
        run: python scripts/audit_readiness.py
